name: Publish to npm

# Trusted Publishing (OIDC): no NPM_TOKEN secret is needed. npm verifies this
# workflow's OIDC identity against the trusted publisher configured on the
# package settings page, then accepts the publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: mint the OIDC token npm exchanges for publish rights

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish dsh-links-panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: references
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # No registry-url here: setup-node would write an .npmrc with a placeholder
          # NODE_AUTH_TOKEN, which overrides the OIDC credential npm 11 obtains itself.
          node-version: '22'

      - name: Upgrade npm for OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5; the Node 22 image ships npm 10,
        # which would silently publish unauthenticated and fail with a 404.
        run: npm install -g npm@^11

      - name: Run the offline test suite
        run: node test/run.mjs

      - name: Show the package that will be published
        run: npm pack --dry-run

      - name: Publish via OIDC trusted publishing
        run: npm publish --access public --provenance --registry https://registry.npmjs.org/
